<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Mixta CR — Boletín Diario</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d24;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --border: #2d3139;
            --tag-bg: #22262e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .wrapper { width: 100%; max-width: 720px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .brand { font-size: 18px; font-weight: 800; color: #ffffff; }
        .brand span { color: var(--accent); }
        .date-badge {
            font-size: 12px;
            background: var(--tag-bg);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--text-muted);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .motivation-card { padding: 0; border: 1px solid var(--border); }
        .motivation-image { width: 100%; height: 180px; object-fit: cover; display: block; }
        .motivation-content {
            padding: 20px;
            background: linear-gradient(180deg, rgba(26,29,36,0.95) 0%, rgba(26,29,36,1) 100%);
            border-left: 4px solid var(--accent);
            font-style: italic;
            font-size: 14px;
            color: #d1d5db;
        }
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 14px;
        }
        .news-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #e5e7eb;
        }
        footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 30px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="brand"><span id="titulo">ZONA MIXTA</span> CR</div>
            <div class="date-badge" id="fecha">Cargando...</div>
        </header>

        <div class="card motivation-card">
            <img id="img-motivacional" src="" alt="Imagen del día" class="motivation-image">
            <div class="motivation-content" id="frase-motivacional">
                Cargando frase...
            </div>
        </div>

        <div class="card">
            <div class="section-title">🇨🇷 Costa Rica — Actualidad</div>
            <div class="news-item" id="noticia-cr">Cargando noticias...</div>
        </div>

        <div class="card">
            <div class="section-title">⚽ Deportes</div>
            <div class="news-item" id="noticia-dep">Cargando deportes...</div>
        </div>

        <footer>
            Zona Mixta CR • Edición Digital
        </footer>
    </div>

    <script>
        fetch('./config.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('fecha').textContent = data.fecha;
                document.getElementById('img-motivacional').src = data.imagen_motivacional;
                document.getElementById('frase-motivacional').textContent = '✨ "' + data.frase_motivacional + '"';
                document.getElementById('noticia-cr').textContent = data.noticia_costa_rica;
                document.getElementById('noticia-dep').textContent = data.noticia_deportes;
            })
            .catch(error => console.error('Error cargando el boletín:', error));
    </script>
</body>
</html>
