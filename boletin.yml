name: Publicar edición diaria

on:
  schedule:
    - cron: "0 7 * * *"   # 7:00 UTC = 1:00 a. m. en Costa Rica
  workflow_dispatch:
    inputs:
      forzar:
        description: "Rehacer la edición de hoy aunque ya exista"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow

      - name: Armar la edición
        env:
          FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: python build.py

      - name: Guardar cambios
        run: |
          git config user.name "Zona Mixta CRC (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Edición $(TZ=America/Costa_Rica date +%F)"
            git push
          fi

      - name: Pedir a GitHub Pages que publique
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se actualizará solo."
