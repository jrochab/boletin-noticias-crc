name: Publicar edición diaria

on:
  schedule:
    - cron: "0 7 * * *"   # 7:00 UTC = 1:00 a. m. en Costa Rica
  workflow_dispatch:
    inputs:
      forzar:
        description: "Rehacer la edición de hoy aunque ya exista"
        type: boolean
        default: false
      prueba_telegram:
        description: "Enviar solo un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow

      - name: Armar la edición
        env:
          FORZAR: ${{ inputs.forzar && '1' || '' }}
          AVISO_PATH: ${{ runner.temp }}/aviso.html
        run: python build.py

      - name: Guardar cambios
        id: guardar
        run: |
          git config user.name "Zona Mixta CRC (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Edición $(TZ=America/Costa_Rica date +%F)"
            git push
            echo "publicado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pedir a GitHub Pages que publique
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se actualizará solo."

      - name: Avisar por Telegram
        if: steps.guardar.outputs.publicado == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVISO_PATH: ${{ runner.temp }}/aviso.html
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram no configurado; se omite."; exit 0; fi
          FECHA=$(TZ=America/Costa_Rica date +%F)
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendPhoto" \
            --form-string chat_id="$TG_CHAT" --form-string parse_mode=HTML \
            -F photo=@"ediciones-${FECHA}-og.jpg" \
            --form-string caption="$(cat "$AVISO_PATH")" || echo "No se pudo enviar el aviso."

      - name: Prueba de Telegram
        if: inputs.prueba_telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Faltan los secretos de Telegram."; exit 1; fi
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendPhoto" \
            --form-string chat_id="$TG_CHAT" --form-string parse_mode=HTML \
            -F photo=@"og-image.jpg" \
            --form-string caption="<b>Zona Mixta CRC 🇨🇷</b>
          Prueba de aviso: si ve este mensaje, Telegram quedó bien configurado."